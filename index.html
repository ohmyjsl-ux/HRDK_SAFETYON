    { title: "AED", text: "AED 위치를 사전에 확인하고 응급상황 시 119에 신고해 주세요." },
    { title: "대피경로", text: "화재 시 엘리베이터를 이용하지 말고 계단으로 대피해 주세요." }
  ],

  emergencyManual: [
    { title: "화재", text: "주변에 알리고 119에 신고한 뒤 가장 가까운 비상구로 대피합니다." },
    { title: "지진", text: "책상 아래에서 몸을 보호하고 흔들림이 멈춘 뒤 계단으로 이동합니다." },
    { title: "응급환자", text: "119 신고 후 환자의 의식과 호흡을 확인하고 가능한 경우 응급처치를 시행합니다." }
  ],

  safetyResources: [
    { title: "도급근로자 안전자료", text: "작업 전 안전수칙, 보호구 착용 및 위험요인 확인자료" },
    { title: "기상특보 행동수칙", text: "폭염·한파·호우 등 기상상황별 안전수칙" },
    { title: "청사 시설 이용수칙", text: "승강기·계단·주차장 등 주요 시설 안전수칙" }
  ]
};

</script>
  <script>
(() => {
  "use strict";

  const config = window.SAFETY_CONFIG || {};
  const allowedLevels = ["정상", "관심", "주의"];
  const levelMeta = {
    정상: { color: "#2e9b43", pale: "#edf8ee", label: "정상" },
    관심: { color: "#f4c430", pale: "#fff8dc", label: "관심" },
    주의: { color: "#e7473c", pale: "#fff0ed", label: "주의" }
  };

  const quickMenus = [
    { key: "report", title: "안전신문고 바로가기", description: "위험요인 즉시 신고", icon: "warning", accent: "#e2a800", bg: "#fffaf0", border: "#f3d697" },
    { key: "buildingGuide", title: "청사 안전 이용 가이드", description: "비상구·대피경로 안내", icon: "exit", accent: "#2e9b43", bg: "#f3faf3", border: "#c9e4c9" },
    { key: "emergency", title: "AED·비상연락", description: "응급상황 대응 정보", icon: "aed", accent: "#2e9b43", bg: "#f3faf3", border: "#c9e4c9" },
    { key: "emergencyManual", title: "행동요령", description: "화재·지진·응급처치", icon: "fire", accent: "#ef6a3a", bg: "#fff5f1", border: "#f5c7b5" },
    { key: "safetyNotice", title: "안전공지", description: "점검·공사·기상특보", icon: "megaphone", accent: "#7057c8", bg: "#f7f4ff", border: "#d9cff8" },
    { key: "safetyResources", title: "안전자료", description: "직원·도급근로자 자료", icon: "document", accent: "#1268e5", bg: "#f1f7ff", border: "#bdd6f7" }
  ];

  const elements = {};
  let lastFocusedElement = null;
  let toastTimer = null;

  document.addEventListener("DOMContentLoaded", init);

  function init() {
    cacheElements();
    applyBasicConfig();
    renderSafetyStatus();
    renderNotices();
    renderQuickMenus(quickMenus);
    bindEvents();
  }

  function cacheElements() {
    [
      "branchName", "organizationName", "menuSearch", "clearSearchButton", "searchResultText",
      "statusLevelText", "statusSummary", "updatedAt", "trafficLight", "noticePreview",
      "quickMenuGrid", "emptySearch", "visibleMenuCount", "modalBackdrop", "modalTitle",
      "modalKicker", "modalBody", "modalCloseButton", "toast", "statusDetailButton",
      "noticeOpenButton", "searchFocusButton", "noticeScrollButton", "helpButton", "refreshButton"
    ].forEach((id) => { elements[id] = document.getElementById(id); });
  }

  function applyBasicConfig() {
    elements.branchName.textContent = config.branchName || "경기서부지사";
    elements.organizationName.textContent = config.organizationName || "한국산업인력공단 경기서부지사";
    document.title = `${config.serviceName || "안전ON"} | ${config.branchName || "경기서부지사"}`;
  }

  function currentStatus() {
    const source = config.safetyStatus || {};
    const level = allowedLevels.includes(source.level) ? source.level : "정상";
    return { ...source, level };
  }

  function renderSafetyStatus() {
    const status = currentStatus();
    const meta = levelMeta[status.level];
    elements.statusLevelText.textContent = status.level;
    elements.statusLevelText.style.color = meta.color;
    elements.statusSummary.textContent = status.summary || "현재 안내사항이 없습니다.";
    elements.updatedAt.textContent = status.updatedAt || "갱신시각 미입력";
    elements.trafficLight.setAttribute("aria-label", `${status.level} 단계`);
    document.querySelectorAll(".light").forEach((light) => {
      light.classList.toggle("is-active", light.dataset.level === status.level);
    });
  }

  function renderNotices() {
    const notices = Array.isArray(config.notices) ? config.notices : [];
    elements.noticePreview.innerHTML = "";
    if (!notices.length) {
      const span = document.createElement("span");
      span.textContent = "등록된 안전이슈가 없습니다.";
      elements.noticePreview.append(span);
      return;
    }
    notices.slice(0, 2).forEach((notice) => {
      const span = document.createElement("span");
      span.textContent = [notice.title, notice.time].filter(Boolean).join(" ");
      elements.noticePreview.append(span);
    });
  }

  function renderQuickMenus(items) {
    elements.quickMenuGrid.innerHTML = "";
    items.forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "quick-card";
      button.dataset.key = item.key;
      button.style.setProperty("--card-accent", item.accent);
      button.style.setProperty("--card-bg", item.bg);
      button.style.setProperty("--card-border", item.border);
      button.setAttribute("aria-label", `${item.title}: ${item.description}`);
      button.innerHTML = `
        <span class="quick-icon" aria-hidden="true">${iconSvg(item.icon)}</span>
        <span class="quick-title">${escapeHtml(item.title)}</span>
        <span class="quick-description">${escapeHtml(item.description)}</span>
        <span class="quick-chevron" aria-hidden="true">›</span>`;
      button.addEventListener("click", () => handleMenu(item.key));
      elements.quickMenuGrid.append(button);
    });
    elements.visibleMenuCount.textContent = `${items.length}개`;
    elements.emptySearch.hidden = items.length > 0;
    elements.quickMenuGrid.hidden = items.length === 0;
  }

  function bindEvents() {
    elements.menuSearch.addEventListener("input", handleSearch);
    elements.clearSearchButton.addEventListener("click", clearSearch);
    elements.searchFocusButton.addEventListener("click", () => elements.menuSearch.focus());
    elements.noticeScrollButton.addEventListener("click", () => document.getElementById("safety-notices").scrollIntoView({ behavior: "smooth", block: "center" }));
    elements.helpButton.addEventListener("click", openHelpModal);
    elements.statusDetailButton.addEventListener("click", openStatusModal);
    elements.noticeOpenButton.addEventListener("click", openNoticesModal);
    elements.refreshButton.addEventListener("click", () => {
      renderSafetyStatus();
      renderNotices();
      showToast("안전정보를 다시 불러왔습니다.");
    });
    elements.modalCloseButton.addEventListener("click", closeModal);
    elements.modalBackdrop.addEventListener("click", (event) => {
      if (event.target === elements.modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !elements.modalBackdrop.hidden) closeModal();
    });
    document.querySelectorAll(".bottom-nav .nav-item").forEach((button) => {
      button.addEventListener("click", () => handleBottomNav(button.dataset.action));
    });
  }

  function handleSearch() {
    const query = elements.menuSearch.value.trim().toLocaleLowerCase("ko-KR");
    elements.clearSearchButton.hidden = !query;
    const filtered = !query ? quickMenus : quickMenus.filter((item) => `${item.title} ${item.description}`.toLocaleLowerCase("ko-KR").includes(query));
    renderQuickMenus(filtered);
    elements.searchResultText.textContent = `${filtered.length}개의 메뉴가 검색되었습니다.`;
  }

  function clearSearch() {
    elements.menuSearch.value = "";
    elements.clearSearchButton.hidden = true;
    renderQuickMenus(quickMenus);
    elements.menuSearch.focus();
  }

  function handleBottomNav(action) {
    document.querySelectorAll(".bottom-nav .nav-item").forEach((item) => item.classList.toggle("is-active", item.dataset.action === action));
    switch (action) {
      case "home": window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "status": document.getElementById("safety-status").scrollIntoView({ behavior: "smooth", block: "center" }); break;
      case "report": handleMenu("report"); break;
      case "guide": handleMenu("buildingGuide"); break;
      case "menu": openMenuModal(); break;
      default: break;
    }
  }

  function handleMenu(key) {
    const url = config.links?.[key] || "#";
    if (url && url !== "#" && url !== "#internal") {
      window.open(url, "_blank", "noopener,noreferrer");
      return;
    }
    if (key === "report") {
      showToast("안전신문고 연결 주소 준비 중입니다. config.js에서 URL을 입력해 주세요.");
      return;
    }
    const handlers = {
      buildingGuide: openBuildingGuideModal,
      emergency: openEmergencyModal,
      emergencyManual: openManualModal,
      safetyNotice: openNoticesModal,
      safetyResources: openResourcesModal
    };
    if (handlers[key]) handlers[key]();
    else showToast("연결 주소 준비 중입니다.");
  }

  function openStatusModal() {
    const status = currentStatus();
    const actionItems = (status.action || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
    openModal("오늘의 안전 신호등", `현재 ${status.level} 단계`, `
      <dl class="detail-grid">
        <dt>현재 단계</dt><dd>${escapeHtml(status.level)}</dd>
        <dt>적용 일시</dt><dd>${escapeHtml(status.updatedAt || "미입력")}</dd>
        <dt>선정 사유</dt><dd>${escapeHtml(status.reason || "별도 사유 없음")}</dd>
        <dt>담당부서</dt><dd>${escapeHtml(status.department || "안전관리 담당부서")}</dd>
      </dl>
      <h3>이용자 행동수칙</h3>
      <ul>${actionItems || "<li>등록된 행동수칙이 없습니다.</li>"}</ul>`);
  }

  function openNoticesModal() {
    const notices = Array.isArray(config.notices) ? config.notices : [];
    const html = notices.length ? notices.map((notice) => `
      <article class="notice-item">
        <div class="notice-top">
          <span class="notice-badge ${escapeHtml(notice.type || "안내")}">${escapeHtml(notice.type || "안내")}</span>
          <h3>${escapeHtml(notice.title || "안전공지")}</h3>
        </div>
        <p class="notice-meta">${escapeHtml([notice.date, notice.time, notice.location].filter(Boolean).join(" · "))}</p>
        <p>${escapeHtml(notice.content || "세부내용이 없습니다.")}</p>
      </article>`).join("") : "<p>등록된 안전이슈가 없습니다.</p>";
    openModal("오늘의 안전이슈", "안전공지", `<div class="notice-list">${html}</div>`);
  }

  function openBuildingGuideModal() {
    openContentListModal("청사 안전 이용 가이드", "시설 안내", config.buildingGuide || []);
  }

  function openManualModal() {
    openContentListModal("비상상황 행동요령", "행동요령", config.emergencyManual || []);
  }

  function openResourcesModal() {
    openContentListModal("안전자료", "자료 안내", config.safetyResources || []);
  }

  function openContentListModal(title, kicker, rows) {
    const html = rows.length ? rows.map((row) => `
      <div class="content-row">
        <div><strong>${escapeHtml(row.title)}</strong><span>${escapeHtml(row.text)}</span></div>
      </div>`).join("") : "<p>등록된 내용이 없습니다.</p>";
    openModal(title, kicker, `<div class="content-list">${html}</div>`);
  }

  function openEmergencyModal() {
    const contacts = Array.isArray(config.emergencyContacts) ? config.emergencyContacts : [];
    const html = contacts.map((contact) => {
      const callable = /^\d+$/.test(String(contact.number).replace(/-/g, ""));
      if (callable) {
        return `<a class="contact-button" href="tel:${escapeHtml(contact.number)}"><div><strong>${escapeHtml(contact.name)}</strong><span>전화 연결</span></div><b>${escapeHtml(contact.number)}</b></a>`;
      }
      return `<div class="contact-button" aria-disabled="true"><div><strong>${escapeHtml(contact.name)}</strong><span>config.js에서 번호를 입력해 주세요.</span></div><b>${escapeHtml(contact.number)}</b></div>`;
    }).join("");
    openModal("AED·비상연락", "응급상황 대응", `<p>긴급한 상황에서는 즉시 119 또는 112에 연락해 주세요.</p><div class="contact-list">${html}</div>`);
  }

  function openHelpModal() {
    openModal("서비스 이용안내", "안전ON", `
      <p>안전ON은 경기서부지사의 청사 안전정보를 한 화면에서 확인하는 QR 통합 안전서비스입니다.</p>
      <h3>이용 방법</h3>
      <ol>
        <li>오늘의 안전 신호등과 안전이슈를 확인합니다.</li>
        <li>필요한 안전서비스 카드를 선택합니다.</li>
        <li>위험요인을 발견한 경우 안전신문고로 신고합니다.</li>
      </ol>
      <p>외부 링크가 아직 등록되지 않은 메뉴는 <strong>config.js</strong>에서 실제 주소를 입력하면 바로 연결됩니다.</p>`);
  }

  function openMenuModal() {
    const buttons = quickMenus.map((item) => `<button type="button" data-modal-menu="${item.key}">${escapeHtml(item.title)}</button>`).join("");
    openModal("전체 메뉴", "안전ON", `<div class="menu-modal-grid">${buttons}</div>`);
    elements.modalBody.querySelectorAll("[data-modal-menu]").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.dataset.modalMenu;
        closeModal(false);
        setTimeout(() => handleMenu(key), 80);
      });
    });
  }

  function openModal(title, kicker, html) {
    lastFocusedElement = document.activeElement;
    elements.modalTitle.textContent = title;
    elements.modalKicker.textContent = kicker;
    elements.modalBody.innerHTML = html;
    elements.modalBackdrop.hidden = false;
    document.body.style.overflow = "hidden";
    const modal = elements.modalBackdrop.querySelector(".modal");
    modal.focus();
    trapFocus(modal);
  }

  function closeModal(restoreFocus = true) {
    elements.modalBackdrop.hidden = true;
    document.body.style.overflow = "";
    if (restoreFocus && lastFocusedElement instanceof HTMLElement) lastFocusedElement.focus();
  }

  function trapFocus(container) {
    container.onkeydown = (event) => {
      if (event.key !== "Tab") return;
      const focusable = [...container.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])')].filter((el) => !el.disabled && el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    };
  }

  function showToast(message) {
    elements.toast.textContent = message;
    elements.toast.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => elements.toast.classList.remove("is-visible"), 2800);
  }

  function iconSvg(name) {
    const icons = {
      warning: '<svg viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Zm0 6v5m0 3v.01"/></svg>',
      exit: '<svg viewBox="0 0 24 24"><path d="M13 4H5v16h8M9 12h12m-4-4 4 4-4 4M8 8l3 2-2 3m2-3 2 4M8 8 6 6"/></svg>',
      aed: '<svg viewBox="0 0 24 24"><path d="M12 21S4 16.4 4 9.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 8 3.5C20 16.4 12 21 12 21Zm1-13-3 5h3l-2 4 5-6h-3l2-3"/></svg>',
      fire: '<svg viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.6 7-6.5 0-3-1.8-5.8-4.7-8.5.2 3-1.2 4.2-2.3 5.1.2-4.3-2.3-6.9-4.1-9.1.2 4.3-3 6.4-3 10.5C5 18.8 8 22 12 22Zm0-7c1.7 1.3 2.4 2.5 2.3 3.8-.1 1.2-1 2.2-2.3 2.2s-2.3-1-2.3-2.2c-.1-1.3.6-2.5 2.3-3.8Z"/></svg>',
      megaphone: '<svg viewBox="0 0 24 24"><path d="M3 11v2h4l5 4V7l-5 4H3Zm9-2 7-3v12l-7-3V9Zm7 2h2v2h-2M7 14l1 5h3l-1-4"/></svg>',
      document: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Zm8 0v5h5M9 12h6M9 16h6"/></svg>'
    };
    return icons[name] || icons.document;
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
  }
})();

</script>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <div class="app-shell">
    <header class="top-header" aria-label="서비스 상단">
      <a class="brand" href="#top" aria-label="안전ON 홈으로 이동">
        <span class="brand-title">안전<span class="power-o" aria-hidden="true">O</span>N</span>
        <span class="brand-branch" id="branchName">경기서부지사</span>
      </a>

      <div class="header-actions" aria-label="빠른 기능">
        <button class="icon-button" id="searchFocusButton" type="button" aria-label="메뉴 검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        </button>
        <button class="icon-button" id="noticeScrollButton" type="button" aria-label="오늘의 안전이슈로 이동">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
        </button>
        <button class="icon-button" id="helpButton" type="button" aria-label="서비스 이용안내">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm0-6v.01M9.8 9a2.3 2.3 0 1 1 3.5 2c-.8.5-1.3 1-1.3 2"/></svg>
        </button>
      </div>
    </header>

    <main id="main-content">
      <section class="search-section" aria-label="메뉴 검색">
        <label class="search-box" for="menuSearch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="menuSearch" type="search" autocomplete="off" placeholder="오늘의 안전을 확인해 보세요" aria-describedby="searchResultText">
          <button id="clearSearchButton" class="clear-search" type="button" aria-label="검색어 지우기" hidden>×</button>
        </label>
        <p id="searchResultText" class="sr-only" aria-live="polite"></p>
      </section>

      <section class="hero-card" id="safety-status" aria-labelledby="statusHeading">
        <div class="hero-content">
          <div class="hero-copy">
            <p class="eyebrow">오늘의 안전 신호등</p>
            <h1 id="statusHeading" class="status-title">오늘은 <strong id="statusLevelText">관심</strong> 단계</h1>
            <p id="statusSummary" class="status-summary">폭염 및 외부 이동 시 수분 섭취 권장</p>
            <div class="hero-actions">
              <button id="statusDetailButton" class="primary-button" type="button">자세히 보기</button>
              <button id="refreshButton" class="ghost-button" type="button" aria-label="안전정보 다시 불러오기">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8M20 3v5h-5"/></svg>
                새로고침
              </button>
            </div>
            <p class="updated-at">마지막 갱신 <time id="updatedAt">2026-08-06 08:30</time></p>
          </div>

          <div class="hero-visual" aria-label="현재 안전단계 신호등">
            <div class="traffic-light" id="trafficLight" role="img" aria-label="관심 단계">
              <span class="light light-green" data-level="정상"></span>
              <span class="light light-yellow" data-level="관심"></span>
